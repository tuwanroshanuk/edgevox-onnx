[package]
name = "edgevox-onnx"
version = "1.13.4"
edition = "2021"
description = "Safe Rust wrapper for edgevox-onnx speech recognition toolkit"
license = "Apache-2.0"
repository = "https://github.com/k2-fsa/edgevox-onnx"
documentation = "https://docs.rs/edgevox-onnx"
readme = "README.md"  # make sure this is inside the crate folder

keywords = ["speech", "speech-to-text", "stt", "onnx", "asr"]
categories = ["api-bindings", "multimedia::audio"]

# Explicitly list files to include in crates.io
include = [
    "src/**",
    "Cargo.toml",
    "README.md",
    "LICENSE*",
]

[features]
default = ["static"]
static = ["edgevox-onnx-sys/static"]
shared = ["edgevox-onnx-sys/shared"]

[dependencies]
edgevox-onnx-sys = { path = "../edgevox-onnx-sys", version = "1.13.4", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[package.metadata.docs.rs]
default-features = false
features = []
