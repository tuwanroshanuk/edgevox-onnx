name: Build @nexuscloud/edgevox-onnx

on:
  workflow_dispatch:
    inputs:
      publish_npm:
        description: 'Publish to npm (@nexuscloud scope)'
        required: false
        default: false
        type: boolean
      npm_version:
        description: 'Optional npm version override (empty = next available version)'
        required: false
        default: ''
        type: string
  push:
    branches:
      - master

concurrency:
  group: nexuscloud-edgevox-onnx-${{ github.ref }}
  # Do not cancel a run while it may be publishing a version.
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  resolve_npm_version:
    name: Resolve npm version
    runs-on: ubuntu-24.04
    outputs:
      npm_version: ${{ steps.version.outputs.npm_version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Select manual override or next available version
        id: version
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.npm_version }}
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED_VERSION:-}" ]; then
            NPM_VERSION="$REQUESTED_VERSION"
          else
            NPM_VERSION=$(node scripts/nexuscloud-npm/scripts/resolve-npm-version.mjs \
              @nexuscloud/edgevox-onnx 1.13.4-espeak-voice)
          fi
          npm view "@nexuscloud/edgevox-onnx@${NPM_VERSION}" version >/dev/null 2>&1 && {
            echo "::error::npm version ${NPM_VERSION} already exists"
            exit 1
          }
          echo "Resolved npm version: ${NPM_VERSION}"
          echo "npm_version=${NPM_VERSION}" >> "$GITHUB_OUTPUT"

  # Cheap gate: catch JS syntax errors (e.g. stray '}}' after espeakVoice edits)
  # before spending ~30m on WASM/Android native builds.
  check-js-syntax:
    name: Check JS syntax
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: node --check wasm + nodejs package sources
        run: |
          set -euo pipefail
          # Keep CommonJS binding in sync with browser ESM source
          python3 wasm/tts/sync-tts-node.py
          if ! git diff --quiet -- wasm/tts/edgevox-onnx-tts.node.js; then
            echo "::error::wasm/tts/edgevox-onnx-tts.node.js is out of sync with edgevox-onnx-tts.js"
            echo "Run: python3 wasm/tts/sync-tts-node.py && commit the result"
            git diff -- wasm/tts/edgevox-onnx-tts.node.js
            exit 1
          fi
          fail=0
          while IFS= read -r -d '' f; do
            echo "node --check $f"
            if ! node --check "$f"; then
              echo "::error::Syntax error in $f"
              fail=1
            fi
          done < <(find wasm/tts scripts/nodejs -name '*.js' -print0)
          exit "$fail"

      - name: Test npm release version resolver
        run: node --test scripts/nexuscloud-npm/scripts/resolve-npm-version.test.mjs

  build-wasm:
    name: WASM (Node.js)
    needs: [check-js-syntax]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential

      - name: Install Emscripten 4.0.23
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.23
          actions-cache-folder: emsdk-cache

      - run: emcc -v

      - name: Build WASM Node.js package
        run: |
          chmod +x build-wasm-simd-nodejs.sh
          ./build-wasm-simd-nodejs.sh
          ls -lh build-wasm-simd-nodejs/install/bin/wasm/nodejs/

      - uses: actions/upload-artifact@v4
        with:
          name: wasm-nodejs
          path: build-wasm-simd-nodejs/install/bin/wasm/nodejs/
          retention-days: 14

  build-native-win-x64:
    name: Native Node addon (Windows x64)
    needs: [check-js-syntax]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build and install edgevox-onnx
        shell: pwsh
        run: |
          $install = Join-Path $PWD "build-native/install"
          cmake -S . -B build-native `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_INSTALL_PREFIX=$install" `
            -DBUILD_SHARED_LIBS=ON `
            -DEDGEVOX_ONNX_ENABLE_WEBSOCKET=OFF `
            -DEDGEVOX_ONNX_ENABLE_PORTAUDIO=OFF `
            -DEDGEVOX_ONNX_ENABLE_BINARY=OFF `
            -DBUILD_ESPEAK_NG_EXE=OFF `
            -DEDGEVOX_ONNX_BUILD_C_API_EXAMPLES=OFF
          cmake --build build-native --config Release --target install -- /m:6
          "EDGEVOX_ONNX_INSTALL_DIR=$install" >> $env:GITHUB_ENV

      - name: Build Node-API addon
        working-directory: scripts/node-addon-api
        shell: pwsh
        run: |
          npm install --ignore-scripts
          npx cmake-js compile --log-level verbose

      - name: Stage native runtime
        shell: pwsh
        run: |
          $out = New-Item -ItemType Directory -Force native/win32-x64
          $addon = Get-ChildItem scripts/node-addon-api/build -Recurse -Filter *.node |
            Select-Object -First 1
          if (-not $addon) { throw "Node addon was not produced" }
          Copy-Item -LiteralPath $addon.FullName -Destination "$out/edgevox-onnx.node"
          Get-ChildItem build-native/install -Recurse -Filter *.dll |
            Copy-Item -Destination $out -Force
          Get-ChildItem build-native/_deps/onnxruntime-src -Recurse -Filter *.dll |
            Copy-Item -Destination $out -Force
          Get-ChildItem $out
          node -e "const a=require('./native/win32-x64/edgevox-onnx.node'); if(typeof a.createOfflineTts!=='function'||typeof a.offlineTtsGenerateWithConfig!=='function') process.exit(2); console.log('native addon load OK')"

      - uses: actions/upload-artifact@v4
        with:
          name: native-win-x64
          path: native/win32-x64/
          retention-days: 14

  build-android:
    name: Android jniLibs
    needs: [check-js-syntax]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential wget unzip

      - name: Set ANDROID_NDK from runner environment
        run: echo "ANDROID_NDK=${ANDROID_NDK_LATEST_HOME}" >> $GITHUB_ENV

      - name: Display NDK
        run: |
          echo "ANDROID_NDK=${ANDROID_NDK}"
          ls -lh "${ANDROID_NDK}"

      - name: Build all Android ABIs
        env:
          EDGEVOX_ONNX_ENABLE_C_API: 'ON'
        run: |
          chmod +x build-android-*.sh
          mkdir -p jniLibs

          build_abi() {
            local script="$1"
            local abi="$2"
            local dir="${script%.sh}"
            echo "========== $script → $abi =========="
            ./"$script"
            mkdir -p "jniLibs/$abi"
            cp -v "$dir/install/lib/"*.so "jniLibs/$abi/"
            rm -rf "$dir"
          }

          build_abi build-android-arm64-v8a.sh arm64-v8a
          build_abi build-android-armv7-eabi.sh armeabi-v7a
          build_abi build-android-x86.sh x86
          build_abi build-android-x86-64.sh x86_64

          find jniLibs -name '*.so' -exec ls -lh {} \;

      - uses: actions/upload-artifact@v4
        with:
          name: android-jnilibs
          path: jniLibs/
          retention-days: 14

  assemble-npm:
    name: Assemble npm package
    needs: [resolve_npm_version, build-wasm, build-native-win-x64, build-android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: wasm-nodejs
          path: /tmp/wasm

      - uses: actions/download-artifact@v4
        with:
          name: android-jnilibs
          path: /tmp/jniLibs

      - uses: actions/download-artifact@v4
        with:
          name: native-win-x64
          path: /tmp/native-win-x64

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Assemble @nexuscloud/edgevox-onnx
        env:
          NPM_VERSION: ${{ needs.resolve_npm_version.outputs.npm_version }}
        run: |
          PKG=scripts/nexuscloud-npm
          OUT=nexuscloud-edgevox-onnx-package

          rm -rf "$OUT"
          mkdir -p "$OUT/android/jniLibs" "$OUT/android/kotlin-api" \
            "$OUT/native/win32-x64" "$OUT/scripts"

          cp -v /tmp/wasm/* "$OUT/"
          # Prefer source-controlled Node TTS bindings (espeakVoice) over any
          # stale copy that may land in the WASM install tree.
          cp -v wasm/tts/edgevox-onnx-tts.node.js "$OUT/"
          cp -v scripts/nodejs/index.js "$OUT/"
          cp -v scripts/nexuscloud-npm/scripts/sync-android.mjs "$OUT/scripts/"
          cp -v scripts/nexuscloud-npm/scripts/benchmark-zipvoice.js "$OUT/scripts/"
          cp -v /tmp/native-win-x64/* "$OUT/native/win32-x64/"
          cp -v edgevox-onnx/kotlin-api/Tts.kt "$OUT/android/kotlin-api/"
          cp -rv /tmp/jniLibs/* "$OUT/android/jniLibs/"

          SHERPA_VERSION=$(grep 'EDGEVOX_ONNX_VERSION' CMakeLists.txt | head -1 | cut -d'"' -f2)
          sed "s/__NPM_VERSION__/${NPM_VERSION}/g; s/__SHERPA_VERSION__/${SHERPA_VERSION}/g" \
            "$PKG/package.json.template" > "$OUT/package.json"

          cp -v "$PKG/README.md" "$OUT/"

          # Fail the package if any shipped JS has a syntax error (e.g. stray '}}').
          # Without this, npm publish can ship a package that crashes on require().
          echo "Syntax-checking packaged JS..."
          fail=0
          for f in "$OUT"/*.js; do
            echo "  node --check $f"
            if ! node --check "$f"; then
              echo "::error::Syntax error in $f"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi

          # Smoke-load the package entry (requires wasm sibling files present).
          node -e "const m=require('./$OUT'); if(typeof m.createOfflineTts!=='function') process.exit(2); console.log('require OK, version=', m.version);"

          ls -lhR "$OUT"

          tar cvjf nexuscloud-edgevox-onnx-${NPM_VERSION}.tar.bz2 "$OUT"
          ls -lh nexuscloud-edgevox-onnx-*.tar.bz2

      - uses: actions/upload-artifact@v4
        with:
          name: nexuscloud-edgevox-onnx-package
          path: |
            nexuscloud-edgevox-onnx-package/
            nexuscloud-edgevox-onnx-*.tar.bz2
          retention-days: 30

      - name: Publish to npm
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_npm == true)
        working-directory: nexuscloud-edgevox-onnx-package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --access public --provenance --tag latest

      - name: Create GitHub release asset (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarball-only
          path: nexuscloud-edgevox-onnx-*.tar.bz2
